
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR трекинг изображений с MindAR</title>
    <!-- Подключаем A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Подключаем MindAR для A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <!-- Настраиваем сцену A-Frame с трекингом изображений -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <!-- Базовое освещение сцены -->
        <a-entity light="type: ambient; color: #BBB"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="0 1 0"></a-entity>

        <!-- Компонент, который отслеживает маркер с индексом 0 -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- 3D-модель, которая появится при наведении на маркер -->
            <a-gltf-model src="model.glb" 
                          position="0 0 0" 
                          scale="0.3 0.3 0.3" 
                          rotation="0 0 0">
            </a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
