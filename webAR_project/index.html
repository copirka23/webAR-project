<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR с model-viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; text-align: center; background-color: #f4f4f4; }
        model-viewer { width: 100%; max-width: 600px; height: 500px; background-color: #e0e0e0; border-radius: 10px; margin: 0 auto; }
        .ar-button {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; border-radius: 30px; background: #007bff; color: white;
            border: none; cursor: pointer; font-size: 16px; font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Задание 1: Базовая WebAR-сцена</h1>
    <p>Нажми на кнопку, чтобы разместить объект в своей комнате</p>

    <!-- Основной компонент model-viewer -->
    <model-viewer 
        src="model.glb" 
        ios-src="model.usdz" 
        alt="3D модель для AR"
        ar 
        ar-modes="webxr scene-viewer quick-look"
        environment-image="https://modelviewer.dev/shared-assets/environments/moon_1k.hdr"
        poster="poster.webp"
        shadow-intensity="1"
        camera-controls 
        touch-action="pan-y">
        
        <button slot="ar-button" class="ar-button">
            👋 Разместить в AR
        </button>
    </model-viewer>
</body>
</html>
